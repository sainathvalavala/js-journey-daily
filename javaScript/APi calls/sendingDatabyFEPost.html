<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form name="userForm" onsubmit="addStd(event)">
      <label for="fullname">FullName:</label>
      <input type="text" id="fullname" name="fullname" />
      <br />
      <label for="age">Age:</label>
      <input type="text" id="age" name="age" />
      <br />
      <button type="submit">Submit</button>
    </form>
    <script>
      function addStd(e) {
        e.preventDefault();
        var nst = {
          fullname: document.userForm.fullname.value,
          age: document.userForm.age.value,
        };
        console.log(nst);
        fetch("http://localhost:2001/addData", {
          method: "POST",
          // headers: headers,
          body: nst,
        }).then((response) => {
          console.log(response);
        });

        // const fullname = document.querySelector('input[name="fullname"]').value;
        // const age = document.querySelector('input[name="age"]').value;
        // const nst = { fullname, age };
        // console.log(nst);
      }
      fetch("http://localhost:2001/apiCall")
        .then((res) => {
          console.log(res.json());
        })
        .then((data) => {
          console.log(data);
        });
    </script>
  </body>
</html>
