<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Callback & Higher-Order Functions</title>
  </head>
  <body>
    <h1>Callback & Higher-Order Functions</h1>
    <p>
      Press <strong>F12</strong> and open the <strong>Console</strong> tab to
      see the output.
    </p>

    <script>
      /*
        ========================================================================
        CORE CONCEPTS:
        ------------------------------------------------------------------------
        1. FIRST-CLASS FUNCTION:
           In JavaScript, EVERY function is a First-Class Citizen.
           This means a function can be:
           - Assigned to a variable
           - Passed as an argument to another function
           - Returned from another function
           const myNumber = 10;                     // Number assigned to variable
           const myString = "apple";                // String assigned to variable
           const sayHi    = function hey() { ... }; // Function assigned to variable (First-Class behavior)


        2. HIGHER-ORDER FUNCTION (HOF):
           Any function that takes another function as an argument
           OR returns a function.

        3. CALLBACK FUNCTION:
           The function that gets passed INTO the Higher-Order Function
           as an argument.
        ========================================================================
      */

      // -----------------------------------------------------------------------
      // SIMPLE EXAMPLE: All 3 concepts in action
      // -----------------------------------------------------------------------

      // 1. First-Class Function (assigned to a variable)
      const sayHi = function hey() {
        return "Hi!";
      };

      // 2. Higher-Order Function (takes a function as an argument)
      function run(fn) {
        //run is a HOF
        console.log(fn()); // calls the passed function
      }

      // 3. Callback Function (sayHi is passed as an argument)
      run(sayHi); // Output: "Hi!"//sayHi is a callbackfunction

      // -----------------------------------------------------------------------
      // PRACTICAL EXAMPLE: Calculator
      // -----------------------------------------------------------------------

      // Callback function
      function add(a, b) {
        return a + b;
      }

      // Higher-Order Function
      function calculate(x, y, operation) {
        return operation(x, y); // executes the callback
      }

      // 'add' is passed as a callback
      console.log("Addition:", calculate(10, 5, add)); // Output: 15

      // -----------------------------------------------------------------------
      // REAL-WORLD ASYNC EXAMPLE: setTimeout
      // -----------------------------------------------------------------------

      // setTimeout is a built-in HOF, and sayHi is the callback
      setTimeout(function () {
        console.log("Timer callback executed after 1 second!");
      }, 1000);
    </script>
  </body>
</html>
